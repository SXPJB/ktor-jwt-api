openapi: "3.0.3"
info:
  title: "JWT Authentication API"
  description: "API for JWT-based authentication and user management"
  version: "1.0.0"
  contact:
    name: "fsociety"
servers:
  - url: "http://localhost:8080"
    description: "Development server"

paths:
  /api/auth:
    post:
      summary: "Authenticate user and get JWT token"
      description: "Authenticates a user with username and password, returns a JWT token if successful"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Successfully authenticated"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
                    description: "JWT token for authentication"
        "401":
          description: "Unauthorized - Invalid credentials"

  /api/user:
    post:
      summary: "Create a new user"
      description: "Creates a new user with the provided information"
      tags:
        - "User Management"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Bad request - Invalid user data"
    get:
      summary: "Get all users"
      description: "Retrieves a list of all users (requires authentication)"
      tags:
        - "User Management"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "List of users"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Unauthorized - Invalid or missing token"

  /api/user/{id}:
    get:
      summary: "Get user by ID"
      description: "Retrieves a specific user by their ID (requires authentication and can only access own user data)"
      tags:
        - "User Management"
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "User ID"
      responses:
        "200":
          description: "User details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Unauthorized - Invalid or missing token"
        "404":
          description: "User not found or not authorized to access"

  /api/user/postgres-db:
    post:
      summary: "Create a new user in PostgreSQL"
      description: "Creates a new user in the PostgreSQL database"
      tags:
        - "PostgreSQL User Management"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    get:
      summary: "Get all users from PostgreSQL"
      description: "Retrieves a list of all users from the PostgreSQL database"
      tags:
        - "PostgreSQL User Management"
      responses:
        "200":
          description: "List of users"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserResponse"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  
  schemas:
    LoginRequest:
      type: "object"
      required:
        - "username"
        - "password"
      properties:
        username:
          type: "string"
          example: "john.doe"
        password:
          type: "string"
          format: "password"
          example: "securePassword123"
    
    UserRequest:
      type: "object"
      required:
        - "username"
        - "password"
        - "email"
      properties:
        username:
          type: "string"
          example: "john.doe"
        password:
          type: "string"
          format: "password"
          example: "securePassword123"
        email:
          type: "string"
          format: "email"
          example: "john.doe@example.com"
    
    UserResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: "string"
          example: "john.doe"
        email:
          type: "string"
          format: "email"
          example: "john.doe@example.com"